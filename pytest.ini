[pytest]
testpaths = tests
pythonpath = . eval
addopts = -m "not llm"
markers =
    mongo: needs MongoDB (set LEDGERSYNC_TEST_MONGODB_URI)
    llm: calls the real model API (opt-in: pytest -m llm; needs OPENROUTER_API_KEY or GROQ_API_KEY)
filterwarnings =
    ignore:builtin type .* has no __module__ attribute:DeprecationWarning
    ignore:`durability` has no effect when no checkpointer is present:UserWarning
